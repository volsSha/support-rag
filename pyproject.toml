[project]
name = "support-rag"
version = "0.1.0"
description = "Support RAG system with NiceGUI, sentence-transformers, and OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.7.0",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.6",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "openai>=1.50.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "pyrate-limiter>=3.0.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
    "python-multipart>=0.0.9",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fakeredis>=2.25.0",
    "respx>=0.22.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
